# Receive OTLP from apps -> batch -> send each signal to its backend.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:                       # metrics: Prometheus scrapes this endpoint
    endpoint: 0.0.0.0:8889
  otlp_grpc/tempo:                       # traces -> Tempo
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:                    # logs -> Loki
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    metrics:                        # the Collector's own health metrics, scraped by Prometheus
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
